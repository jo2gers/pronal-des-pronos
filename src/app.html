<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- PWA manifest. ?v=4 cache-busts after the Mosaïque rebrand so
		     iOS/Android fetch the new icon files instead of serving the
		     cached amber-bitmap from the previous design. -->
		<link rel="manifest" href="/manifest.webmanifest?v=4" />
		<meta name="theme-color" content="#0a0a0c" />
		<meta name="application-name" content="Tifo" />

		<!-- iOS add-to-home-screen support -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Tifo" />
		<link rel="apple-touch-icon" href="/favicons/apple-touch-icon-180.png?v=4" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon-180.png?v=4" />
		<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=4" />
		<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png?v=4" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
